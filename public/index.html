<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라이브아이돌 프로듀서 디렉토리</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --border: #e9ecef;
      --text-primary: #1a1a2e;
      --text-secondary: #6c757d;
      --accent: #00e5ff;
      --accent-dark: #00b8cc;
      --link: #00b8cc;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.6;
    }

    /* ── GNB ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      height: 56px;
    }

    .gnb-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .gnb-brand {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      text-decoration: none;
      flex-shrink: 0;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    nav::-webkit-scrollbar { display: none; }

    nav a {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 400;
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    nav a:hover { color: var(--text-primary); background: var(--surface); }
    nav a.active {
      color: var(--accent-dark);
      font-weight: 500;
      background: rgba(0, 229, 255, 0.1);
    }

    /* ── Main ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* ── Loading / Error ── */
    #loading {
      text-align: center;
      padding: 80px 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* ── Sections ── */
    .category-section {
      padding: 64px 0 0;
    }

    .category-section h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }

    /* ── Card Grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    /* ── Producer Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: row;
      gap: 24px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      box-shadow: 0 4px 16px rgba(0, 229, 255, 0.12);
      border-color: var(--accent);
    }

    .card-left {
      flex: 0 0 240px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .card-genre {
      display: inline-block;
      background: rgba(0, 229, 255, 0.12);
      color: var(--accent-dark);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      align-self: flex-start;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .card-idol {
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--text-secondary);
    }

    .card-comment {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
      flex: 1;
      white-space: pre-wrap;
    }

    .card-tracks {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-track {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .card-track::before {
      content: "♪";
      color: var(--accent-dark);
      flex-shrink: 0;
    }

    .card-track a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s;
    }
    .card-track a:hover { color: var(--accent-dark); text-decoration: underline; }

    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .card-footer a {
      color: var(--link);
      font-size: 0.825rem;
      text-decoration: none;
      font-weight: 400;
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .card-footer a:hover { color: var(--accent-dark); text-decoration: underline; }

    .x-icon {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .card-footer .official-link::before {
      content: "🔗 ";
      font-style: normal;
    }

    /* ── Footer ── */
    footer {
      margin-top: 80px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .disclaimer {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .disclaimer + .disclaimer {
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .disclaimer-lang {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--accent-dark);
      background: rgba(0, 229, 255, 0.1);
      border-radius: 3px;
      padding: 1px 6px;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    /* ── Accordion ── */
    .accordion-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent-dark);
      font-size: 0.78rem;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
      margin-top: 2px;
      transition: color 0.15s;
    }
    .accordion-btn:hover { color: var(--accent); }
    .accordion-btn svg {
      width: 12px;
      height: 12px;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .accordion-btn.open svg { transform: rotate(180deg); }

    .card-tracks-extra {
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .card-tracks-extra.open { display: flex; }

    /* ── Search ── */
    #search-wrap {
      position: relative;
      padding: 14px 0 10px;
    }

    .search-bar-row {
      position: relative;
      display: flex;
      align-items: center;
    }

    #search-input {
      width: 100%;
      height: 44px;
      padding: 0 44px 0 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      background: var(--surface);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.12);
    }
    #search-input::placeholder { color: var(--text-secondary); opacity: 1; }

    #search-close {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    #search-close.visible { display: flex; align-items: center; justify-content: center; }
    #search-close:hover { color: var(--text-primary); background: var(--border); }

    #search-results {
      display: none;
      position: absolute;
      top: calc(100% - 6px);
      left: 0;
      right: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      z-index: 95;
      max-height: 60vh;
      overflow-y: auto;
    }
    #search-results.active { display: block; }

    .search-result-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
      transition: background 0.1s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--surface); }

    .search-res-producer {
      font-weight: 500;
      color: var(--text-primary);
    }
    .search-res-sep {
      color: var(--border);
      flex-shrink: 0;
    }
    .search-res-track { color: var(--text-secondary); }
    .search-res-track a {
      color: var(--link);
      text-decoration: none;
      transition: color 0.15s;
    }
    .search-res-track a:hover { color: var(--accent-dark); text-decoration: underline; }
    .search-res-artist {
      color: var(--text-secondary);
      font-size: 0.825rem;
    }

    .search-no-results {
      padding: 20px 16px;
      color: var(--text-secondary);
      font-size: 0.875rem;
      text-align: center;
    }

    #search-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 85;
    }
    #search-overlay.active { display: block; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .gnb-brand { display: none; }
      .gnb-inner { padding: 0 16px; gap: 16px; }
      main { padding: 0 16px 60px; }
      .category-section { padding: 48px 0 0; }
      .card { flex-direction: column; gap: 12px; }
      .card-left { flex: none; }
      .footer-inner { padding: 24px 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="gnb-inner">
    <a class="gnb-brand" href="#">라이브아이돌 프로듀서</a>
    <nav id="gnb-nav">
      <a href="#find-actively" data-section="find-actively">적극 모집 프로듀서</a>
      <a href="#chika-idol-active" data-section="chika-idol-active">라이브아이돌 프로듀서</a>
      <a href="#subculture" data-section="subculture">서브컬처 프로듀서</a>
      <a href="#hybrid" data-section="hybrid">하이브리드 장르 프로듀서</a>
      <a href="#overseas" data-section="overseas">해외 프로듀서</a>
    </nav>
  </div>
</header>

<main>
  <div id="search-wrap">
    <div class="search-bar-row">
      <input id="search-input" type="search" placeholder="프로듀서명, 곡명, 아티스트명으로 검색… / プロデューサー名・曲名・アーティスト名で検索…" autocomplete="off" spellcheck="false">
      <button id="search-close" type="button" aria-label="검색 닫기">✕</button>
    </div>
    <div id="search-results"></div>
  </div>
  <div id="loading">Loading producers…</div>
</main>

<script>
  const SHEET_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJ8sJFqWDWb5kQsEVkSfeLr-NgsWpbxPR4Wxe-bTpCQeXtignl4qDiEy7azvFbVJ9w9cA8pLzW4au3/pub?gid=1615162975&single=true&output=tsv";
  const TRACKS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJ8sJFqWDWb5kQsEVkSfeLr-NgsWpbxPR4Wxe-bTpCQeXtignl4qDiEy7azvFbVJ9w9cA8pLzW4au3/pub?gid=2138418262&single=true&output=tsv";

  const CATEGORY_ORDER = [
    "Find actively",
    "Chika Idol Active",
    "Subculture",
    "Hybrid",
    "Overseas"
  ];

  const SECTION_IDS = {
    "Find actively":     "find-actively",
    "Chika Idol Active": "chika-idol-active",
    "Subculture":        "subculture",
    "Hybrid":            "hybrid",
    "Overseas":          "overseas"
  };

  const CATEGORY_LABELS = {
    "Find actively":     "적극 모집 프로듀서",
    "Chika Idol Active": "라이브아이돌 프로듀서",
    "Subculture":        "서브컬처 프로듀서",
    "Hybrid":            "하이브리드 장르 프로듀서",
    "Overseas":          "해외 프로듀서"
  };

  async function fetchProducers() {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const tsv = await res.text();
    const [, ...rows] = tsv.trim().split("\n");

    const producers = rows
      .map(row => {
        const cols = row.split("\t").map(c => c.trim());
        return {
          category:     cols[0] || "",
          name:         cols[1] || "",
          contactX:     cols[2] || "",
          mainGenre:    cols[3] || "",
          idolName:     cols[4] || "",
          officialPage: cols[5] || "",
          comment:      cols[6] || ""
        };
      })
      .filter(p => p.name);

    const grouped = {};
    CATEGORY_ORDER.forEach(cat => {
      grouped[cat] = producers.filter(p => p.category === cat);
    });
    return grouped;
  }

  async function fetchTracks() {
    if (TRACKS_URL.includes("YOUR_TRACKS_GID")) return {};
    try {
      const res = await fetch(TRACKS_URL);
      if (!res.ok) return {};
      const tsv = await res.text();
      const [, ...rows] = tsv.trim().split("\n");
      const map = {};
      rows.forEach(row => {
        const cols = row.split("\t").map(c => c.trim());
        const producerName  = cols[0] || "";
        const trackTitle    = cols[1] || "";
        const trackTitleAlt = cols[2] || "";
        const trackArtist   = cols[3] || "";
        const trackArtistAlt = cols[4] || "";
        const trackUrl      = cols[5] || "";
        const featured      = (cols[6] || "").toUpperCase() === "TRUE";
        if (!producerName || !trackTitle) return;
        if (!map[producerName]) map[producerName] = [];
        map[producerName].push({ trackTitle, trackTitleAlt, trackArtist, trackArtistAlt, trackUrl, featured });
      });
      return map;
    } catch {
      return {};
    }
  }

  function xHandle(raw) {
    // strip leading @ or full-width ＠
    return raw.replace(/^[@＠]/, "");
  }

  const CHEVRON_SVG = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,4 6,8 10,4"/></svg>`;

  function buildTrackRow(t) {
    const row = document.createElement("div");
    row.className = "card-track";
    if (t.trackUrl) {
      const a = document.createElement("a");
      a.href = t.trackUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = t.trackTitle;
      row.appendChild(a);
    } else {
      row.appendChild(document.createTextNode(t.trackTitle));
    }
    if (t.trackArtist) {
      row.appendChild(document.createTextNode(` - ${t.trackArtist}`));
    }
    return row;
  }

  function buildCard(p, tracks) {
    const card = document.createElement("div");
    card.className = "card";

    // Left column: genre badge, name, idol name
    const left = document.createElement("div");
    left.className = "card-left";

    if (p.mainGenre) {
      const badge = document.createElement("span");
      badge.className = "card-genre";
      badge.textContent = p.mainGenre;
      left.appendChild(badge);
    }

    const name = document.createElement("h3");
    name.className = "card-name";
    name.textContent = p.name;
    left.appendChild(name);

    if (p.idolName) {
      const idol = document.createElement("div");
      idol.className = "card-idol";
      idol.textContent = p.idolName;
      left.appendChild(idol);
    }

    card.appendChild(left);

    // Right column: comment, tracks, footer links
    const right = document.createElement("div");
    right.className = "card-right";

    if (p.comment) {
      const comment = document.createElement("p");
      comment.className = "card-comment";
      comment.textContent = p.comment;
      right.appendChild(comment);
    }

    const featured = tracks.filter(t => t.featured);
    const extra    = tracks.filter(t => !t.featured);
    const showAccordion = tracks.length >= 3 && extra.length > 0;

    if (tracks.length) {
      const wrap = document.createElement("div");

      // Featured tracks — always visible
      const featuredEl = document.createElement("div");
      featuredEl.className = "card-tracks";
      featured.forEach(t => featuredEl.appendChild(buildTrackRow(t)));
      wrap.appendChild(featuredEl);

      if (showAccordion) {
        // Extra tracks — hidden until expanded
        const extraEl = document.createElement("div");
        extraEl.className = "card-tracks-extra";
        extra.forEach(t => extraEl.appendChild(buildTrackRow(t)));
        wrap.appendChild(extraEl);

        const btn = document.createElement("button");
        btn.className = "accordion-btn";
        btn.innerHTML = `${CHEVRON_SVG}더보기 (+${extra.length}곡)`;
        btn.addEventListener("click", () => {
          const isOpen = extraEl.classList.toggle("open");
          btn.classList.toggle("open", isOpen);
          btn.innerHTML = isOpen
            ? `${CHEVRON_SVG}접기`
            : `${CHEVRON_SVG}더보기 (+${extra.length}곡)`;
        });
        wrap.appendChild(btn);
      }

      right.appendChild(wrap);
    }

    if (p.contactX || p.officialPage) {
      const footer = document.createElement("div");
      footer.className = "card-footer";

      if (p.contactX) {
        const handle = xHandle(p.contactX);
        const xLink = document.createElement("a");
        xLink.href = `https://x.com/${handle}`;
        xLink.target = "_blank";
        xLink.rel = "noopener noreferrer";
        const icon = document.createElement("img");
        icon.src = "/Twitter-X.svg";
        icon.alt = "X";
        icon.className = "x-icon";
        xLink.appendChild(icon);
        xLink.appendChild(document.createTextNode(`@${handle}`));
        footer.appendChild(xLink);
      }

      if (p.officialPage) {
        const oLink = document.createElement("a");
        oLink.href = p.officialPage;
        oLink.target = "_blank";
        oLink.rel = "noopener noreferrer";
        oLink.className = "official-link";
        try {
          oLink.textContent = new URL(p.officialPage).hostname.replace(/^www\./, "");
        } catch {
          oLink.textContent = p.officialPage;
        }
        footer.appendChild(oLink);
      }

      right.appendChild(footer);
    }

    card.appendChild(right);
    return card;
  }

  function setupSearch(grouped, trackMap) {
    const searchData = [];
    CATEGORY_ORDER.forEach(cat => {
      (grouped[cat] || []).forEach(p => {
        (trackMap[p.name] || []).forEach(t => {
          searchData.push({
            producerName:   p.name,
            trackTitle:     t.trackTitle,
            trackTitleAlt:  t.trackTitleAlt  || "",
            trackArtist:    t.trackArtist    || "",
            trackArtistAlt: t.trackArtistAlt || "",
            trackUrl:       t.trackUrl       || ""
          });
        });
      });
    });

    const input   = document.getElementById("search-input");
    const closeBtn = document.getElementById("search-close");
    const results  = document.getElementById("search-results");
    const overlay  = document.getElementById("search-overlay");

    function closeSearch() {
      input.value = "";
      closeBtn.classList.remove("visible");
      results.classList.remove("active");
      results.innerHTML = "";
      overlay.classList.remove("active");
    }

    function runSearch(raw) {
      const q = raw.trim().toLowerCase();
      if (!q) { closeSearch(); return; }

      const matches = searchData.filter(item =>
        item.producerName.toLowerCase().includes(q)   ||
        item.trackTitle.toLowerCase().includes(q)     ||
        item.trackTitleAlt.toLowerCase().includes(q)  ||
        item.trackArtist.toLowerCase().includes(q)    ||
        item.trackArtistAlt.toLowerCase().includes(q)
      );

      results.innerHTML = "";
      if (matches.length === 0) {
        const empty = document.createElement("div");
        empty.className = "search-no-results";
        empty.textContent = "검색 결과가 없습니다. / 検索結果がありません。";
        results.appendChild(empty);
      } else {
        matches.forEach(item => {
          const row = document.createElement("div");
          row.className = "search-result-item";

          const prod = document.createElement("span");
          prod.className = "search-res-producer";
          prod.textContent = item.producerName;
          row.appendChild(prod);

          const sep1 = document.createElement("span");
          sep1.className = "search-res-sep";
          sep1.textContent = "—";
          row.appendChild(sep1);

          const track = document.createElement("span");
          track.className = "search-res-track";
          if (item.trackUrl) {
            const a = document.createElement("a");
            a.href = item.trackUrl;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = item.trackTitle;
            track.appendChild(a);
          } else {
            track.textContent = item.trackTitle;
          }
          row.appendChild(track);

          if (item.trackArtist) {
            const sep2 = document.createElement("span");
            sep2.className = "search-res-sep";
            sep2.textContent = "—";
            row.appendChild(sep2);

            const artist = document.createElement("span");
            artist.className = "search-res-artist";
            artist.textContent = item.trackArtist;
            row.appendChild(artist);
          }

          results.appendChild(row);
        });
      }

      results.classList.add("active");
      overlay.classList.add("active");
      closeBtn.classList.add("visible");
    }

    input.removeEventListener("input", input._searchHandler);
    input._searchHandler = () => runSearch(input.value);
    input.addEventListener("input", input._searchHandler);

    closeBtn.onclick = closeSearch;
    overlay.onclick  = closeSearch;
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSearch(); });
  }

  function renderPage(grouped, trackMap) {
    const main = document.querySelector("main");
    const loading = document.getElementById("loading");
    if (loading) loading.remove();
    main.querySelectorAll(".category-section").forEach(s => s.remove());

    setupSearch(grouped, trackMap);

    const sections = [];

    CATEGORY_ORDER.forEach(cat => {
      const items = grouped[cat] || [];
      if (!items.length) return;

      const section = document.createElement("section");
      section.className = "category-section";
      section.id = SECTION_IDS[cat];

      const heading = document.createElement("h2");
      heading.textContent = CATEGORY_LABELS[cat] || cat;
      section.appendChild(heading);

      const grid = document.createElement("div");
      grid.className = "card-grid";
      items.forEach(p => grid.appendChild(buildCard(p, trackMap[p.name] || [])));
      section.appendChild(grid);

      main.appendChild(section);
      sections.push(section);
    });

    setupIntersectionObserver(sections);
  }

  function setupIntersectionObserver(sections) {
    const navLinks = document.querySelectorAll("#gnb-nav a[data-section]");

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(a => {
            a.classList.toggle("active", a.dataset.section === entry.target.id);
          });
        }
      });
    }, { rootMargin: "-30% 0px -60% 0px", threshold: 0 });

    sections.forEach(s => observer.observe(s));

    navLinks.forEach(a => {
      a.addEventListener("click", e => {
        e.preventDefault();
        const target = document.getElementById(a.dataset.section);
        if (target) target.scrollIntoView({ behavior: "smooth" });
      });
    });
  }

  (async () => {
    try {
      const [data, trackMap] = await Promise.all([fetchProducers(), fetchTracks()]);
      renderPage(data, trackMap);
    } catch (err) {
      document.getElementById("loading").textContent =
        "データの読み込みに失敗しました。シートが公開されているか確認してください。 / 데이터를 불러오지 못했습니다. 시트가 공개 설정인지 확인하세요。";
    }
  })();
</script>
