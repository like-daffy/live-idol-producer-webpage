<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    // Set the theme before the first paint. Storage may be unavailable.
    (() => {
      let preference = null;
      try {
        const saved = localStorage.getItem("ld-theme");
        if (saved === "light" || saved === "dark") preference = saved;
      } catch {}
      const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme-preference", preference || "system");
      document.documentElement.setAttribute("data-theme", preference || (systemDark ? "dark" : "light"));
    })();
  </script>
  <title>라이브아이돌 프로듀서 디렉토리</title>
  <meta name="description" content="국내 라이브아이돌 오리지널 곡 프로듀스 작곡 및 편곡가, 믹싱 마스터링 참여 정보">
  <meta name="keywords" content="지하아이돌, 지하돌, 오리곡, 오리지널곡, 라이브아이돌, 프로듀서, 작곡가, 편곡가">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://live-idol-producer.web.app/">

  <!-- Open Graph -->
  <meta property="og:title" content="라이브아이돌 프로듀서 디렉토리">
  <meta property="og:description" content="국내 라이브아이돌 오리지널 곡 프로듀스 작곡 및 편곡가, 믹싱 마스터링 참여 정보">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://live-idol-producer.web.app/">
  <meta property="og:site_name" content="라이브아이돌 프로듀서 디렉토리">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:locale:alternate" content="ja_JP">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="라이브아이돌 프로듀서 디렉토리">
  <meta name="twitter:description" content="국내 라이브아이돌 오리지널 곡 프로듀스 작곡 및 편곡가, 믹싱 마스터링 참여 정보">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="light"] {
      --bg: #ffffff;
      --inset: #f6fafb;
      --card: #ffffff;
      --border: #dfe9ed;
      --text-primary: #14252d;
      --text-secondary: #566b76;
      --accent: #00e5ff;
      --accent-tint: #e6fafd;
      --link: #007f91;
      --focus: #009fb6;
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --bg: #091319;
      --inset: #0f1e26;
      --card: #12232d;
      --border: #263d48;
      --text-primary: #edf8fb;
      --text-secondary: #a3bac5;
      --accent: #00e5ff;
      --accent-tint: #143640;
      --link: #58deee;
      --focus: #58deee;
      color-scheme: dark;
    }

    *,*::before,*::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans KR','Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      transition: background .18s ease,color .18s ease;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      transition: background .18s ease,border-color .18s ease;
    }

    .gnb-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .gnb-brand {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      text-decoration: none;
      flex-shrink: 0;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex: 1;
      min-width: 0;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    nav a {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: .875rem;
      font-weight: 400;
      padding: 8px 12px;
      border-radius: 8px;
      white-space: nowrap;
      transition: color .15s,background .15s;
    }

    nav a:hover {
      color: var(--text-primary);
      background: var(--inset);
    }

    nav a.active {
      color: var(--link);
      font-weight: 500;
      background: var(--accent-tint);
    }

    nav a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .theme-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      cursor: pointer;
      transition: background .15s,border-color .15s,color .15s;
    }

    .theme-btn:hover {
      border-color: var(--accent);
      color: var(--link);
    }

    .theme-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .theme-btn svg {
      width: 20px;
      height: 20px;
    }

    .theme-btn .icon-moon {
      display: none;
    }

    :root[data-theme="dark"] .theme-btn .icon-sun {
      display: none;
    }

    :root[data-theme="dark"] .theme-btn .icon-moon {
      display: inline;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    #search-wrap {
      position: relative;
      padding: 20px 0 8px;
    }

    .search-bar-row {
      position: relative;
      display: flex;
      align-items: center;
    }

    #search-input {
      width: 100%;
      height: 48px;
      padding: 0 48px 0 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: var(--inset);
      color: var(--text-primary);
      outline: none;
      transition: border-color .15s,box-shadow .15s,background .18s ease,color .18s ease;
    }

    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-tint);
    }

    #search-input::placeholder {
      color: var(--text-secondary);
      opacity: 1;
    }

    #search-close {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 1rem;
      border-radius: 8px;
      transition: color .15s,background .15s;
    }

    #search-close.visible {
      display: flex;
    }

    #search-close:hover {
      color: var(--text-primary);
      background: var(--border);
    }

    #search-results {
      display: none;
      position: absolute;
      top: calc(100% - 4px);
      left: 0;
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      z-index: 95;
      max-height: 60vh;
      overflow-y: auto;
    }

    #search-results.active {
      display: block;
    }

    .search-result-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: .9rem;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover {
      background: var(--inset);
    }

    .search-res-producer {
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
    }

    .search-res-producer:hover {
      color: var(--link);
      text-decoration: underline;
    }

    .search-res-sep {
      color: var(--border);
      flex-shrink: 0;
    }

    .search-res-track {
      color: var(--text-secondary);
      min-width: 0;
      word-break: break-word;
    }

    .search-res-track a {
      color: var(--link);
      text-decoration: none;
    }

    .search-res-track a:hover {
      text-decoration: underline;
    }

    .search-res-artist {
      color: var(--text-secondary);
      font-size: .85rem;
    }

    .search-no-results {
      padding: 20px 16px;
      color: var(--text-secondary);
      font-size: .9rem;
      text-align: center;
    }

    #search-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 85;
    }

    #search-overlay.active {
      display: block;
    }

    .category-section {
      padding: 56px 0 0;
      scroll-margin-top: 80px;
    }

    .category-section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      display: flex;
      flex-direction: row;
      gap: 24px;
      transition: box-shadow .2s ease,border-color .2s ease,background .18s ease;
    }

    .card:hover {
      box-shadow: 0 4px 18px var(--accent-tint);
      border-color: var(--accent);
    }

    .card-left {
      flex: 0 0 240px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .card-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .card-genre {
      display: inline-block;
      background: var(--accent-tint);
      color: var(--link);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .03em;
      align-self: flex-start;
      max-width: 100%;
      word-break: break-word;
    }

    .card-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
      word-break: break-word;
    }

    .card-idol {
      font-size: .875rem;
      font-weight: 400;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .card-comment {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card-tracks,.card-tracks-extra {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-tracks-extra {
      display: none;
    }

    .card-tracks-extra.open {
      display: flex;
    }

    .card-track {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      min-width: 0;
    }

    .card-track::before {
      content: "♪";
      color: var(--link);
      flex-shrink: 0;
    }

    .card-track a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color .15s;
    }

    .card-track a:hover {
      color: var(--link);
      text-decoration: underline;
    }

    .track-info,.credit-roles {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 6px;
      min-width: 0;
      word-break: break-word;
    }

    .credit-role {
      display: inline-block;
      padding: 1px 7px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--inset);
      color: var(--text-secondary);
      font-size: 11px;
      line-height: 1.6;
      white-space: nowrap;
    }

    .accordion-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--link);
      font-size: .82rem;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 2px;
      margin-top: 2px;
      min-height: 44px;
      transition: color .15s;
    }

    .accordion-btn:hover {
      color: var(--accent);
    }

    .accordion-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .accordion-btn svg {
      width: 12px;
      height: 12px;
      transition: transform .2s ease;
      flex-shrink: 0;
    }

    .accordion-btn.open svg {
      transform: rotate(180deg);
    }

    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    .card-footer a {
      color: var(--link);
      font-size: .85rem;
      text-decoration: none;
      transition: color .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      word-break: break-all;
    }

    .card-footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .card-footer a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .x-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .official-link::before {
      content: "🔗 ";
      font-style: normal;
    }

    footer {
      margin-top: 80px;
      border-top: 1px solid var(--border);
      background: var(--inset);
      transition: background .18s ease,border-color .18s ease;
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .disclaimer {
      font-size: .8rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .disclaimer+.disclaimer {
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .disclaimer-lang {
      display: inline-block;
      font-size: .68rem;
      font-weight: 500;
      color: var(--link);
      background: var(--accent-tint);
      border-radius: 4px;
      padding: 1px 7px;
      margin-bottom: 4px;
      letter-spacing: .04em;
    }

    @media (max-width:1023px) {
      .card-left {
        flex: 0 0 190px;
      }

    }

    @media (max-width:640px) {
      .gnb-inner {
        flex-wrap: wrap;
        padding: 10px 16px;
        gap: 10px 16px;
      }

      .gnb-brand {
        font-size: 1rem;
      }

      nav {
        order: 3;
        flex-basis: 100%;
      }

      main {
        padding: 0 16px 60px;
      }

      .category-section {
        padding: 44px 0 0;
      }

      .card {
        flex-direction: column;
        gap: 14px;
        padding: 18px 18px;
      }

      .card-left {
        flex: none;
      }

      .footer-inner {
        padding: 24px 16px;
      }

    }

    @media (prefers-reduced-motion:reduce) {
      html {
        scroll-behavior: auto;
      }

      *,*::before,*::after {
        transition: none!important;
      }

    }

    /* Required responsive and interaction corrections. */
    body {
      background: var(--bg);
      color: var(--text-primary);
    }

    .theme-btn {
      margin-left: auto;
    }

    .theme-btn .icon-sun {
      display: none;
    }

    .theme-btn .icon-moon {
      display: inline;
    }

    :root[data-theme="dark"] .theme-btn .icon-sun {
      display: inline;
    }

    :root[data-theme="dark"] .theme-btn .icon-moon {
      display: none;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
    }

    #search-wrap {
      z-index: 90;
    }

    #search-close {
      right: 2px;
      width: 44px;
      height: 44px;
    }

    #search-close:focus-visible,#search-results a:focus-visible,.card-track a:focus-visible,.gnb-brand:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 4px;
    }

    #search-input:focus-visible {
      border-color: var(--focus);
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .accordion-btn:hover,.card-footer a:hover {
      color: var(--link);
    }

    .category-section,.card {
      scroll-margin-top: 88px;
    }

    .search-res-producer,.search-res-artist,.track-info a {
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .credit-role {
      max-width: 100%;
    }

    @media(max-width:1023px) {
      .gnb-inner {
        display: grid;
        grid-template-columns: minmax(0,1fr) 44px;
        column-gap: 16px;
        row-gap: 8px;
      }

      .gnb-brand {
        grid-column: 1;
        grid-row: 1;
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .theme-btn {
        grid-column: 2;
        grid-row: 1;
      }

      nav {
        grid-column: 1/-1;
        grid-row: 2;
        min-width: 0;
        max-width: 100%;
        width: 100%;
      }

      .category-section,.card {
        scroll-margin-top: 132px;
      }

    }

    @media(max-width:640px) {
      .gnb-inner {
        padding: 10px 16px;
      }

      .card-footer a {
        min-height: 44px;
      }

    }

    /* Live loading state and color-adaptive X icon. */
    #loading {
      text-align: center;
      padding: 80px 0;
      color: var(--text-secondary);
      font-size: .9rem;
    }

    .x-icon {
      display: inline-block;
      background: currentColor;
      -webkit-mask: url("/Twitter-X.svg") center/contain no-repeat;
      mask: url("/Twitter-X.svg") center/contain no-repeat;
    }
  </style>
</head>
<body>

<header>
  <div class="gnb-inner">
    <a class="gnb-brand" href="#">라이브아이돌 프로듀서</a>
    <nav id="gnb-nav" aria-label="프로듀서 카테고리 / プロデューサーカテゴリー">
      <a href="#find-actively" data-section="find-actively">적극 모집 프로듀서</a>
      <a href="#chika-idol-active" data-section="chika-idol-active">라이브아이돌 프로듀서</a>
      <a href="#subculture" data-section="subculture">서브컬처 프로듀서</a>
      <a href="#hybrid" data-section="hybrid">하이브리드 장르 프로듀서</a>
      <a href="#overseas" data-section="overseas">해외 프로듀서</a>
    </nav>
    <button id="theme-toggle" class="theme-btn" type="button" aria-pressed="false" aria-label="다크 모드로 전환 / ダークモードに切り替える" title="다크 모드로 전환 / ダークモードに切り替える">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <div id="search-wrap">
    <div class="search-bar-row">
      <input id="search-input" type="search" aria-label="프로듀서 검색 / プロデューサー検索" placeholder="프로듀서명, 곡명, 아티스트명, 참여 역할로 검색… / 名前・曲名・アーティスト名・参加役割で検索…" autocomplete="off" spellcheck="false">
      <button id="search-close" type="button" aria-label="검색 닫기 / 検索を閉じる">✕</button>
    </div>
    <div id="search-results"></div>
  </div>
  <div id="loading">Loading producers…</div>
</main>

<script>
  function setupTheme() {
    const root = document.documentElement;
    const button = document.getElementById("theme-toggle");
    const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

    function apply(theme) {
      root.setAttribute("data-theme", theme);
      button.setAttribute("aria-pressed", String(theme === "dark"));
      const label = theme === "dark"
        ? "라이트 모드로 전환 / ライトモードに切り替える"
        : "다크 모드로 전환 / ダークモードに切り替える";
      button.setAttribute("aria-label", label);
      button.title = label;
    }

    apply(root.getAttribute("data-theme") || "light");
    button.addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      // Remember the explicit choice in memory even if storage is blocked.
      root.setAttribute("data-theme-preference", next);
      apply(next);
      try { localStorage.setItem("ld-theme", next); } catch {}
    });

    if (media) {
      const changed = event => {
        if (root.getAttribute("data-theme-preference") === "system") {
          apply(event.matches ? "dark" : "light");
        }
      };
      if (media.addEventListener) media.addEventListener("change", changed);
      else if (media.addListener) media.addListener(changed);
    }
  }

  const SHEET_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJ8sJFqWDWb5kQsEVkSfeLr-NgsWpbxPR4Wxe-bTpCQeXtignl4qDiEy7azvFbVJ9w9cA8pLzW4au3/pub?gid=1615162975&single=true&output=tsv";
  const TRACKS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJ8sJFqWDWb5kQsEVkSfeLr-NgsWpbxPR4Wxe-bTpCQeXtignl4qDiEy7azvFbVJ9w9cA8pLzW4au3/pub?gid=2138418263&single=true&output=tsv";
  const CREDITS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJ8sJFqWDWb5kQsEVkSfeLr-NgsWpbxPR4Wxe-bTpCQeXtignl4qDiEy7azvFbVJ9w9cA8pLzW4au3/pub?gid=2138418264&single=true&output=tsv";

  const CREDIT_ROLES = [
    { name: "Produce", description: "작곡·편곡·음악 프로듀싱 / 作曲・編曲・音楽プロデュース" },
    { name: "Mix & Mastering", description: "믹싱·마스터링 / ミックス・マスタリング" },
    { name: "Vocal Director", description: "보컬 디렉팅 / ボーカルディレクション" },
    { name: "Bass", description: "베이스 연주 / ベース演奏" },
    { name: "Drum", description: "드럼 연주 / ドラム演奏" }
  ];

  // Every documented column must exist; optional cell values may stay blank.
  const PRODUCER_HEADERS = [
    "category", "name", "contactX", "mainGenre", "idolName", "officialPage", "comment", "producerId"
  ];
  const SONG_HEADERS = [
    "songId", "trackTitle", "trackTitleAlt", "trackArtist", "trackArtistAlt", "trackUrl"
  ];
  const CREDIT_HEADERS = [
    "songId", "trackTitle", "trackArtist", "producerId", "producerName",
    ...CREDIT_ROLES.map(role => role.name), "featured", "creditNote", "creditSourceUrl"
  ];

  const CATEGORY_ORDER = [
    "Find actively",
    "Chika Idol Active",
    "Subculture",
    "Hybrid",
    "Overseas"
  ];

  const SECTION_IDS = {
    "Find actively":     "find-actively",
    "Chika Idol Active": "chika-idol-active",
    "Subculture":        "subculture",
    "Hybrid":            "hybrid",
    "Overseas":          "overseas"
  };

  const CATEGORY_LABELS = {
    "Find actively":     "적극 모집 프로듀서",
    "Chika Idol Active": "라이브아이돌 프로듀서",
    "Subculture":        "서브컬처 프로듀서",
    "Hybrid":            "하이브리드 장르 프로듀서",
    "Overseas":          "해외 프로듀서"
  };

  // Published TSV quotes cells containing tabs, newlines, or quotation marks.
  // Read columns by header so moving a column in Sheets is safe.
  function parseTSV(text, requiredHeaders = []) {
    const rows = [];
    let row = [], cell = "", quoted = false;
    const input = text.replace(/^\uFEFF/, "");
    for (let i = 0; i < input.length; i++) {
      const char = input[i];
      if (char === '"') {
        if (quoted && input[i + 1] === '"') { cell += '"'; i++; }
        else if (quoted || cell === "") quoted = !quoted;
        else cell += char;
      } else if (!quoted && (char === "\t" || char === "\n" ||
                 (char === "\r" && input[i + 1] === "\n"))) {
        row.push(cell.trim());
        cell = "";
        if (char !== "\t") {
          rows.push(row);
          row = [];
          if (char === "\r" && input[i + 1] === "\n") i++;
        }
      } else cell += char;
    }
    if (quoted) throw new Error("Unclosed quoted TSV cell");
    if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
    const headers = rows.shift() || [];
    const missing = requiredHeaders.filter(header => !headers.includes(header));
    if (missing.length) {
      throw new Error(`Missing required Sheet columns: ${missing.join(", ")}`);
    }
    return rows.filter(cols => cols.some(Boolean)).map(cols =>
      Object.fromEntries(headers.map((header, i) => [header, cols[i] || ""]))
    );
  }

  async function fetchRows(url, requiredHeaders) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return parseTSV(await res.text(), requiredHeaders);
  }

  async function fetchProducers() {
    const producers = (await fetchRows(SHEET_URL, PRODUCER_HEADERS))
      .filter(p => p.name);
    const ids = new Set();
    producers.forEach(p => {
      if (!p.producerId || ids.has(p.producerId)) throw new Error("Missing or duplicate producerId");
      ids.add(p.producerId);
    });
    const grouped = {};
    CATEGORY_ORDER.forEach(cat => {
      grouped[cat] = producers.filter(p => p.category === cat);
    });
    return grouped;
  }

  async function fetchTracks() {
    const [songs, credits] = await Promise.all([
      fetchRows(TRACKS_URL, SONG_HEADERS),
      fetchRows(CREDITS_URL, CREDIT_HEADERS)
    ]);
    const songsById = new Map();
    songs.filter(song => song.trackTitle).forEach(song => {
      if (!song.songId || songsById.has(song.songId)) throw new Error("Missing or duplicate songId");
      songsById.set(song.songId, song);
    });
    const map = Object.create(null);
    const joined = new Map();
    credits.forEach(credit => {
      const roles = CREDIT_ROLES.filter(role => credit[role.name].toUpperCase() === "TRUE").map(role => role.name);
      const featured = credit.featured.toUpperCase() === "TRUE";
      // Empty checkbox rows in the prepared Sheet grid export FALSE values.
      if (!credit.songId && !credit.producerId && !roles.length && !featured &&
          !credit.creditNote && !credit.creditSourceUrl && !credit.trackTitle &&
          !credit.trackArtist && !credit.producerName) return;
      if (!credit.songId || !credit.producerId) throw new Error("Incomplete song credit");
      const song = songsById.get(credit.songId);
      if (!song) throw new Error("Unknown credit songId");
      const key = JSON.stringify([credit.producerId, credit.songId]);
      const existing = joined.get(key);
      if (existing) {
        existing.roles = [...new Set([...existing.roles, ...roles])];
        existing.featured ||= featured;
        return;
      }
      const track = { ...song, roles, featured };
      joined.set(key, track);
      if (!map[credit.producerId]) map[credit.producerId] = [];
      map[credit.producerId].push(track);
    });
    return map;
  }

  // The page and the prerender load the same data with the same checks.
  async function loadDirectory() {
    const [grouped, trackMap] = await Promise.all([fetchProducers(), fetchTracks()]);
    const knownIds = new Set(Object.values(grouped).flat().map(p => p.producerId));
    if (Object.keys(trackMap).some(id => !knownIds.has(id))) throw new Error("Unknown credit producerId");
    return [grouped, trackMap];
  }

  function xHandle(raw) {
    // strip leading @ or full-width ＠
    return raw.replace(/^[@＠]/, "");
  }

  function normalizeExternalUrl(raw) {
    const value = raw.trim();
    if (!value || /[\s\\]/.test(value)) return "";
    try {
      const url = new URL(/^https?:\/\//i.test(value)
        ? value : `https://${value.replace(/^\/\//, "")}`);
      const validHost = url.hostname.startsWith("[") ||
        /^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.?$/i.test(url.hostname);
      if (!validHost || !["https:", "http:"].includes(url.protocol) || url.username || url.password) return "";
      return url.href;
    } catch {
      return "";
    }
  }

  function scrollToElement(target) {
    if (!target) return;
    const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    target.scrollIntoView({ behavior: reducedMotion ? "auto" : "smooth" });
  }

  const CHEVRON_SVG = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,4 6,8 10,4"/></svg>`;

  // One delegated listener serves prerendered and live cards alike.
  function setupAccordions(main) {
    main.addEventListener("click", event => {
      const btn = event.target.closest(".accordion-btn");
      if (!btn) return;
      const extraEl = document.getElementById(btn.getAttribute("aria-controls"));
      const isOpen = extraEl.classList.toggle("open");
      btn.classList.toggle("open", isOpen);
      btn.setAttribute("aria-expanded", String(isOpen));
      const count = extraEl.querySelectorAll(".card-track").length;
      btn.innerHTML = isOpen
        ? `${CHEVRON_SVG}접기`
        : `${CHEVRON_SVG}더보기 (+${count}곡)`;
    });
  }

  function buildCreditRoles(roles) {
    const wrap = document.createElement("span");
    wrap.className = "credit-roles";
    roles.forEach(name => {
      const badge = document.createElement("span");
      badge.className = "credit-role";
      badge.textContent = name;
      badge.title = CREDIT_ROLES.find(role => role.name === name).description;
      wrap.appendChild(badge);
    });
    return wrap;
  }

  function buildTrackRow(t) {
    const row = document.createElement("div");
    row.className = "card-track";
    const info = document.createElement("span");
    info.className = "track-info";
    const trackUrl = normalizeExternalUrl(t.trackUrl);
    if (trackUrl) {
      const a = document.createElement("a");
      a.href = trackUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = t.trackTitle;
      info.appendChild(a);
    } else {
      info.appendChild(document.createTextNode(t.trackTitle));
    }
    if (t.trackArtist) {
      info.appendChild(document.createTextNode(` - ${t.trackArtist}`));
    }
    if (t.roles.length) info.appendChild(buildCreditRoles(t.roles));
    row.appendChild(info);
    return row;
  }

  function buildCard(p, tracks) {
    const card = document.createElement("div");
    card.className = "card";
    card.id = `producer-${p.producerId}`;

    // Left column: genre badge, name, idol name
    const left = document.createElement("div");
    left.className = "card-left";

    if (p.mainGenre) {
      const badge = document.createElement("span");
      badge.className = "card-genre";
      badge.textContent = p.mainGenre;
      left.appendChild(badge);
    }

    const name = document.createElement("h3");
    name.className = "card-name";
    name.textContent = p.name;
    left.appendChild(name);

    if (p.idolName) {
      const idol = document.createElement("div");
      idol.className = "card-idol";
      idol.textContent = p.idolName;
      left.appendChild(idol);
    }

    card.appendChild(left);

    // Right column: comment, tracks, footer links
    const right = document.createElement("div");
    right.className = "card-right";

    if (p.comment) {
      const comment = document.createElement("p");
      comment.className = "card-comment";
      comment.textContent = p.comment;
      right.appendChild(comment);
    }

    const featured = tracks.filter(t => t.featured);
    const extra    = tracks.filter(t => !t.featured);
    const showAccordion = tracks.length >= 3 && extra.length > 0;

    if (tracks.length) {
      const wrap = document.createElement("div");

      // Featured tracks — always visible
      const featuredEl = document.createElement("div");
      featuredEl.className = "card-tracks";
      featured.forEach(t => featuredEl.appendChild(buildTrackRow(t)));
      wrap.appendChild(featuredEl);

      if (showAccordion) {
        // Extra tracks — hidden until expanded
        const extraEl = document.createElement("div");
        extraEl.className = "card-tracks-extra";
        extraEl.id = `tracks-${p.producerId}`;
        extra.forEach(t => extraEl.appendChild(buildTrackRow(t)));
        wrap.appendChild(extraEl);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "accordion-btn";
        btn.setAttribute("aria-expanded", "false");
        btn.setAttribute("aria-controls", extraEl.id);
        btn.innerHTML = `${CHEVRON_SVG}더보기 (+${extra.length}곡)`;
        wrap.appendChild(btn);
      } else {
        extra.forEach(t => featuredEl.appendChild(buildTrackRow(t)));
      }

      right.appendChild(wrap);
    }

    const officialPage = normalizeExternalUrl(p.officialPage);
    if (p.contactX || officialPage) {
      const footer = document.createElement("div");
      footer.className = "card-footer";

      if (p.contactX) {
        const handle = xHandle(p.contactX);
        const xLink = document.createElement("a");
        xLink.href = `https://x.com/${handle}`;
        xLink.target = "_blank";
        xLink.rel = "noopener noreferrer";
        const icon = document.createElement("span");
        icon.setAttribute("aria-hidden", "true");
        icon.className = "x-icon";
        xLink.appendChild(icon);
        xLink.appendChild(document.createTextNode(`@${handle}`));
        footer.appendChild(xLink);
      }

      if (officialPage) {
        const oLink = document.createElement("a");
        oLink.href = officialPage;
        oLink.target = "_blank";
        oLink.rel = "noopener noreferrer";
        oLink.className = "official-link";
        oLink.textContent = new URL(officialPage).hostname.replace(/^www\./, "");
        footer.appendChild(oLink);
      }

      right.appendChild(footer);
    }

    card.appendChild(right);
    return card;
  }

  function setupSearch(grouped, trackMap) {
    const searchData = [];
    CATEGORY_ORDER.forEach(cat => {
      (grouped[cat] || []).forEach(p => {
        searchData.push({ type: "profile", producerId: p.producerId, producerName: p.name });
        (trackMap[p.producerId] || []).forEach(t => {
          searchData.push({
            type:           "track",
            producerId:     p.producerId,
            producerName:   p.name,
            trackTitle:     t.trackTitle,
            trackTitleAlt:  t.trackTitleAlt  || "",
            trackArtist:    t.trackArtist    || "",
            trackArtistAlt: t.trackArtistAlt || "",
            trackUrl:       t.trackUrl       || "",
            roles:          t.roles,
            roleSearchText: t.roles.map(name => {
              const role = CREDIT_ROLES.find(role => role.name === name);
              return `${name} ${role.description}`;
            }).join(" ").toLowerCase()
          });
        });
      });
    });

    const input   = document.getElementById("search-input");
    const closeBtn = document.getElementById("search-close");
    const results  = document.getElementById("search-results");
    const overlay  = document.getElementById("search-overlay");

    function closeSearch() {
      input.value = "";
      closeBtn.classList.remove("visible");
      results.classList.remove("active");
      results.innerHTML = "";
      overlay.classList.remove("active");
    }

    function runSearch(raw) {
      const q = raw.trim().toLowerCase();
      if (!q) { closeSearch(); return; }

      const matches = searchData.filter(item =>
        item.producerName.toLowerCase().includes(q)   ||
        (item.type === "track" && (
          item.trackTitle.toLowerCase().includes(q)     ||
          item.trackTitleAlt.toLowerCase().includes(q)  ||
          item.trackArtist.toLowerCase().includes(q)    ||
          item.trackArtistAlt.toLowerCase().includes(q) ||
          item.roleSearchText.includes(q)
        ))
      );

      results.innerHTML = "";
      if (matches.length === 0) {
        const empty = document.createElement("div");
        empty.className = "search-no-results";
        empty.textContent = "검색 결과가 없습니다. / 検索結果がありません。";
        results.appendChild(empty);
      } else {
        matches.forEach(item => {
          const row = document.createElement("div");
          row.className = "search-result-item";

          const prod = document.createElement("a");
          prod.className = "search-res-producer";
          prod.textContent = item.producerName;
          prod.href = `#${encodeURIComponent(`producer-${item.producerId}`)}`;
          prod.addEventListener("click", e => {
            e.preventDefault();
            closeSearch();
            scrollToElement(document.getElementById(`producer-${item.producerId}`));
          });
          row.appendChild(prod);

          if (item.type === "profile") {
            results.appendChild(row);
            return;
          }

          const sep1 = document.createElement("span");
          sep1.className = "search-res-sep";
          sep1.textContent = "—";
          row.appendChild(sep1);

          const track = document.createElement("span");
          track.className = "search-res-track";
          const trackUrl = normalizeExternalUrl(item.trackUrl);
          if (trackUrl) {
            const a = document.createElement("a");
            a.href = trackUrl;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = item.trackTitle;
            track.appendChild(a);
          } else {
            track.textContent = item.trackTitle;
          }
          row.appendChild(track);

          if (item.trackArtist) {
            const sep2 = document.createElement("span");
            sep2.className = "search-res-sep";
            sep2.textContent = "—";
            row.appendChild(sep2);

            const artist = document.createElement("span");
            artist.className = "search-res-artist";
            artist.textContent = item.trackArtist;
            row.appendChild(artist);
          }

          if (item.roles.length) row.appendChild(buildCreditRoles(item.roles));

          results.appendChild(row);
        });
      }

      results.classList.add("active");
      overlay.classList.add("active");
      closeBtn.classList.add("visible");
    }

    input.removeEventListener("input", input._searchHandler);
    input._searchHandler = () => runSearch(input.value);
    input.addEventListener("input", input._searchHandler);

    closeBtn.onclick = closeSearch;
    overlay.onclick  = closeSearch;
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSearch(); });
    return closeSearch;
  }

  function renderPage(grouped, trackMap) {
    const main = document.querySelector("main");
    const loading = document.getElementById("loading");
    if (loading) loading.remove();
    main.querySelectorAll(".category-section").forEach(s => s.remove());

    const closeSearch = setupSearch(grouped, trackMap);

    const sections = [];

    CATEGORY_ORDER.forEach(cat => {
      const items = grouped[cat] || [];
      if (!items.length) return;

      const section = document.createElement("section");
      section.className = "category-section";
      section.id = SECTION_IDS[cat];

      const heading = document.createElement("h2");
      heading.textContent = CATEGORY_LABELS[cat] || cat;
      section.appendChild(heading);

      const grid = document.createElement("div");
      grid.className = "card-grid";
      items.forEach(p => grid.appendChild(buildCard(p, trackMap[p.producerId] || [])));
      section.appendChild(grid);

      main.appendChild(section);
      sections.push(section);
    });

    setupIntersectionObserver(sections, closeSearch);
  }

  // Structured data repeats only what the page shows: the site and the listed profiles.
  function buildStructuredData(grouped, site) {
    const profiles = CATEGORY_ORDER.flatMap(cat => grouped[cat] || []);
    return {
      "@context": "https://schema.org",
      "@graph": [
        { "@type": "WebSite", "@id": `${site.url}#website`, url: site.url, name: site.name, inLanguage: ["ko", "ja"] },
        {
          "@type": "CollectionPage",
          "@id": `${site.url}#page`,
          url: site.url,
          name: site.name,
          isPartOf: { "@id": `${site.url}#website` },
          mainEntity: {
            "@type": "ItemList",
            numberOfItems: profiles.length,
            itemListElement: profiles.map((p, i) => ({
              "@type": "ListItem",
              position: i + 1,
              name: p.name,
              url: `${site.url}#${encodeURIComponent(`producer-${p.producerId}`)}`
            }))
          }
        }
      ]
    };
  }

  function updateStructuredData(grouped) {
    const site = {
      url: document.querySelector('link[rel="canonical"]').href,
      name: document.querySelector('meta[property="og:site_name"]').content
    };
    let script = document.getElementById("directory-ld");
    if (!script) {
      script = document.createElement("script");
      script.type = "application/ld+json";
      script.id = "directory-ld";
      document.head.appendChild(script);
    }
    script.textContent = JSON.stringify(buildStructuredData(grouped, site));
  }

  function setupIntersectionObserver(sections, closeSearch) {
    const navLinks = document.querySelectorAll("#gnb-nav a[data-section]");

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(a => {
            a.classList.toggle("active", a.dataset.section === entry.target.id);
          });
        }
      });
    }, { rootMargin: "-30% 0px -60% 0px", threshold: 0 });

    sections.forEach(s => observer.observe(s));

    navLinks.forEach(a => {
      a.addEventListener("click", e => {
        e.preventDefault();
        closeSearch();
        scrollToElement(document.getElementById(a.dataset.section));
      });
    });
  }

  (async () => {
    setupTheme();
    setupAccordions(document.querySelector("main"));
    try {
      const [grouped, trackMap] = await loadDirectory();
      renderPage(grouped, trackMap);
      updateStructuredData(grouped);
    } catch (err) {
      console.error("Directory data could not be loaded:", err);
      // A prerendered snapshot stays visible below the error.
      const loading = document.getElementById("loading");
      if (loading) {
        loading.hidden = false;
        loading.textContent =
          "データの読み込みに失敗しました。シートの公開設定と入力内容を確認してください。 / 데이터를 불러오지 못했습니다. 시트의 공개 설정과 입력 내용을 확인하세요.";
      }
    }
  })();
</script>
